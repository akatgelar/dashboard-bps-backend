host: localhost:8080
info:
  contact: {}
  description: REST API Dashboard BPS (master & insight endpoints) - schema webapi.
  title: Dashboard BPS API
  version: "2.0"
paths:
  /datacontent:
    get:
      consumes:
      - application/json
      description: Get list datacontent (payload data)
      parameters:
      - description: JSON array of {field,operator,value}
        example: '[{"field":"domain_id","operator":"eq","value":"0000"}]'
        in: query
        name: filter
        type: string
      - description: sort column (single)
        example: datacontent_value
        in: query
        name: sort
        type: string
      - default: asc
        description: asc | desc
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      - description: per page, default 20
        example: 20
        in: query
        name: per_page
        type: integer
      - description: page, 1-based
        example: 1
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.DataContentListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.BaseResponse'
      summary: List datacontent
      tags:
      - master
  /insight/big-number:
    get:
      consumes:
      - application/json
      description: Get aggregated big number (current & previous year comparison)
        from webapi.datacontent
      parameters:
      - description: domain_id
        example: "0000"
        in: query
        name: domain_id
        required: true
        type: string
      - description: var_id
        example: "286"
        in: query
        name: var_id
        required: true
        type: string
      - description: turvar_id
        example: "530"
        in: query
        name: turvar_id
        required: true
        type: string
      - description: tahun_id
        example: "125"
        in: query
        name: tahun_id
        required: true
        type: string
      - description: turtahun_id
        example: "0"
        in: query
        name: turtahun_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.BigNumberResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.BaseResponse'
      summary: Insight big number
      tags:
      - insight
  /insight/per-tahun:
    get:
      consumes:
      - application/json
      description: Get data per region (vervar) & per year from webapi.datacontent
      parameters:
      - description: domain_id
